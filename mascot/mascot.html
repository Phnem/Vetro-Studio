<!doctype html>
<!--
  Прототип анимаций empty state с маскотом Vetro (по раскадровке пользователя и SVG-ригу из его zip).
  Ничего не внедряется в приложение: страница рисует кадр по времени t, render.py снимает кадры и собирает mp4.

  Режимы (query): ?mode=grid&theme=dark|light   — 6 сцен сеткой 3×2, как на раскадровке
                  ?mode=app&theme=dark          — экран приложения: сцены по очереди с заголовком и подписью
  Хук для рендера: window.renderAt(seconds); window.DURATION — длина ролика.

  Все сцены — функции pose(t) от времени цикла, без случайностей: тот же код потом переносится в Compose.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: SnPro; src: url("fonts/snpro_bold.ttf"); font-weight: 700; }
  html, body { margin: 0; padding: 0; overflow: hidden; }
  body { font-family: SnPro, "Segoe UI", sans-serif; }
  #stage { position: relative; }
  .cell { position: absolute; display: flex; flex-direction: column; align-items: center; }
  .label { font-weight: 700; font-size: 26px; letter-spacing: .2px; }
  .hint { font-family: "Segoe UI", sans-serif; font-size: 17px; margin-top: 4px; }
  .app-text { position: absolute; left: 0; right: 0; text-align: center; }
  .app-title { font-weight: 700; font-size: 25px; }
  .app-sub { font-family: "Segoe UI", sans-serif; font-size: 15px; line-height: 21px; margin: 8px auto 0; max-width: 300px; }
  .app-btn { display: inline-block; margin-top: 22px; padding: 12px 22px; border-radius: 999px; font-weight: 700; font-size: 15px; }
</style>
</head>
<body>
<div id="stage"></div>
<!-- зерно-дизеринг: тёмные градиенты фона и тела в 8-битном mp4 иначе распадаются на полосы -->
<svg id="grain" style="position:absolute;left:0;top:0;pointer-events:none;mix-blend-mode:overlay;opacity:.16">
  <filter id="grainF" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7"/><feColorMatrix type="saturate" values="0"/></filter>
  <rect width="100%" height="100%" filter="url(#grainF)"/>
</svg>
<script>
/* ───────────────────────── палитра ───────────────────────── */
const Q = new URLSearchParams(location.search);
const MODE = Q.get("mode") || "grid";
let THEME = Q.get("theme") || "dark";
const ORANGE = "#E85002"; // BrandOrange — оранжевый маскота (#ee4f12 в наброске) сведён к бренду
const THEMES = {
  light: {
    bg: "linear-gradient(180deg,#FFD8CB 0%,#FBEDE6 30%,#F9F9F9 62%,#F9F9F9 100%)",
    blob: "#FDE9DD", shadow: "#F9D5C1", body: "#2B3038", side: "#2B3038", rim: "rgba(255,255,255,.12)",
    eye: "#FFD3AE", mouth: "#E9B7A0", paper: "#FFFAF6", paperDeep: "#F9D5C1", bubble: "#FFFFFF",
    ink: "#1B1D21", muted: "rgba(27,29,33,.55)", glow: 0, btnBg: "#1B1D21", btnInk: "#F9F9F9",
    front: "#3C434F", shadeK: 0.16, hiK: 0.06, mouthIn: "#6B3324",
  },
  dark: {
    bg: "linear-gradient(180deg,#430B05 0%,#210907 24%,#000000 58%,#000000 100%)",
    blob: "rgba(232,80,2,.16)", shadow: "rgba(0,0,0,.6)", body: "#16181C", side: "#16181C", rim: "rgba(255,176,103,.22)",
    eye: "#FFD3AE", mouth: "#E9B7A0", paper: "#1A1412", paperDeep: "#2A1A12", bubble: "#171717",
    ink: "#F9F9F9", muted: "rgba(249,249,249,.55)", glow: 1, btnBg: "#E85002", btnInk: "#FFFFFF",
    front: "#2C3038", shadeK: 0.4, hiK: 0.07, mouthIn: "#4A2016",
  },
};
let C = THEMES[THEME];
const setTheme = (th) => { THEME = th; C = THEMES[th]; };

/* ───────────────────────── время и кривые ───────────────────────── */
const E = {
  lin: (x) => x,
  io: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  out: (x) => 1 - Math.pow(1 - x, 3),
  in: (x) => x * x * x,
  sine: (x) => -(Math.cos(Math.PI * x) - 1) / 2,
  back: (x) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  // затухающая пружина: перелёт и пара колебаний, к x=1 ровно в цели
  spring: (x) => { const f = (u) => 1 - Math.exp(-6.5 * u) * Math.cos(11 * u); return f(x) / f(1); },
};
/** Ключи [[t, v, ease], ...]: значение в t, кривая — у ключа, К которому идём. */
function kf(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i][0]) {
      const [t0, v0] = keys[i - 1];
      const [t1, v1, e = "io"] = keys[i];
      const x = t1 === t0 ? 1 : (t - t0) / (t1 - t0);
      return v0 + (v1 - v0) * E[e](x);
    }
  }
  return keys[keys.length - 1][1];
}
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const TAU = Math.PI * 2;
/** Моргание: в моменты times глаза схлопываются за ~0.09 с туда и обратно. */
function blink(t, times, d = 0.09) {
  let s = 1;
  for (const tb of times) { const k = Math.abs(t - tb); if (k < d) s = Math.min(s, 0.08 + 0.92 * (k / d)); }
  return s;
}
/** Огибающая «включено» между a и b с плавными краями fade. */
function env(t, a, b, fade = 0.3) { return clamp((t - a) / fade) * clamp((b - t) / fade); }
/** Пружинное появление: 0 → 1 с перелётом, начиная с t0. */
function pop(t, t0, dur = 0.45) { return t <= t0 ? 0 : t >= t0 + dur ? 1 : E.back((t - t0) / dur); }

/* ───────────────────────── маскот (риг из наброска, доработан) ─────────────────────────
   Корпус — псевдо-3D куб: yaw (поворот вокруг вертикали, + — лицом вправо), pitch (+ — кивок вперёд, вниз),
   rot (крен корпуса), lean (наклон всего тела от ступней). Глубина получается «выдавливанием»: BODY рисуется
   стопкой копий от задней грани к передней (задняя чуть меньше — перспектива), лицо лежит на передней грани
   и уезжает в сторону поворота. Силуэт меняет форму, как на раскадровке, без видимых граней.
   Руки — гибкие «шланги»: кривая Безье от бока силуэта к кисти. armL/armR — куда смотрит кисть от плеча
   (градусы), bendL/bendR — изгиб в «локте» (> 0 — кисть наружу/вверх, < 0 — внутрь), frontR — правая рука
   поверх корпуса (у подбородка). Кончик руки отстаёт от поворота (скорость позы за 0.06 с).
   Стык рука/корпус скругляется галтелью — без острого угла в плече. */
const NEUTRAL = { x: 0, jump: 0, rot: 0, y: 0, sx: 1, sy: 1, yaw: 0, pitch: 0, lean: 0,
  armL: 7, armR: -7, bendL: 10, bendR: 10, legL: 0, legR: 0,
  lookX: 0, lookY: 0, eyeS: 1, eyeSX: 1, eyeSY: 1, happy: 0, smile: 1, sad: 0, o: 0, grin: 0, lid: 0,
  frontR: 0, frontL: 0, inL: 0, inR: 0 };
const rotv = ([x, y], deg) => { const a = (deg * Math.PI) / 180, c = Math.cos(a), s = Math.sin(a); return [x * c - y * s, x * s + y * c]; };
const dirv = (deg) => rotv([0, 1], deg);
const angOf = ([x, y]) => (Math.atan2(-x, y) * 180) / Math.PI;
const f2 = (v) => v.toFixed(3);
const f4 = (v) => v.toFixed(5); // масштабы и матрицы: дыхание ±1.3% при 2 знаках прыгало ступеньками

/* Корпус — «обмылок»: суперэллипсоид |x/BA|^n + |y/BB|^n + |z/BD|^n ≤ 1 (центр в (0, BCY), z — к зрителю).
   Поворот yaw (вокруг вертикали) и pitch (кивок), ортографическая проекция. Силуэт выпуклый и считается точно:
   для экранного направления e опорная точка тела — замкнутая формула через двойственную норму (m = n/(n−1)).
   Поэтому при любом повороте контур гладкий, без граней и «рёбер»; передняя грань светлее и мягко уходит в бока. */
const BA = 104, BB = 112, BD = 72, BN = 4.2, BCY = -159;
function bodyR(p) {
  const ya = (p.yaw * Math.PI) / 180, pa = (p.pitch * Math.PI) / 180;
  const cy = Math.cos(ya), sy = Math.sin(ya), cp = Math.cos(pa), sp = Math.sin(pa);
  return { cp, r0: [cy, 0, sy], r1: [-sp * sy, cp, sp * cy] };
}
const dot3 = (r, v) => r[0] * v[0] + r[1] * v[1] + r[2] * v[2];
const proj = (R, v) => [dot3(R.r0, v), dot3(R.r1, v) + BCY];
const BAX = [BA, BB, BD], BM = BN / (BN - 1);
/** Экранный силуэт корпуса: опорные точки по направлениям 0..2π, близкие точки склеены. */
function silhouette(R, N = 180) {
  const pts = [];
  for (let i = 0; i < N; i++) {
    const th = (TAU * i) / N, ex = Math.cos(th), ey = Math.sin(th);
    const w = [0, 1, 2].map((j) => BAX[j] * (R.r0[j] * ex + R.r1[j] * ey));
    const nm = Math.pow(w.reduce((s, x) => s + Math.pow(Math.abs(x), BM), 0), 1 / BM) || 1;
    const q = proj(R, w.map((wi, j) => BAX[j] * Math.sign(wi) * Math.pow(Math.abs(wi) / nm, BM - 1)));
    const last = pts[pts.length - 1];
    if (!last || Math.hypot(q[0] - last[0], q[1] - last[1]) > 1.2) pts.push(q);
  }
  return pts;
}
/** Сечение корпуса на глубине z = k·BD (масштаб sc), дуга параметра t0..t1 — в экранных координатах. */
function section(R, k, sc = 1, t0 = 0, t1 = TAU, N = 64) {
  const s = Math.pow(1 - Math.pow(k, BN), 1 / BN) * sc, e = 2 / BN, pts = [];
  for (let i = 0; i <= N; i++) {
    const t = t0 + ((t1 - t0) * i) / N, c = Math.cos(t), si = Math.sin(t);
    pts.push(proj(R, [BA * s * Math.sign(c) * Math.pow(Math.abs(c), e), BB * s * Math.sign(si) * Math.pow(Math.abs(si), e), BD * k]));
  }
  return pts;
}
const polyD = (pts, close = true) => "M" + pts.map((q) => `${f2(q[0])},${f2(q[1])}`).join(" L") + (close ? " Z" : "");
/** Плоскость передней грани (z = BD) как svg-матрица: лицо лежит на ней и сжимается/сдвигается с поворотом. */
const facePlane = (R) => `translate(0,${BCY}) matrix(${f4(R.r0[0])},${f4(R.r1[0])},0,${f4(R.r1[1])},${f4(R.r0[2] * BD)},${f4(R.r1[2] * BD)}) translate(0,${-BCY})`;

/** Бок силуэта на стороне side на высоте плеча: x края, диапазон по y для галтелей, s3x — плечо на боковой грани. */
function sideEdge(p, side) {
  const R = bodyR(p), sil = silhouette(R, 120);
  const S3 = proj(R, [side * BA * 0.82, 26, 0]), ys = S3[1];
  let x = side * BA, found = false;
  for (let i = 0; i < sil.length; i++) {
    const P = sil[i], Q = sil[(i + 1) % sil.length];
    if ((P[1] - ys) * (Q[1] - ys) <= 0 && P[1] !== Q[1]) {
      const xx = P[0] + ((Q[0] - P[0]) * (ys - P[1])) / (Q[1] - P[1]);
      if (!found || side * xx > side * x) { x = xx; found = true; }
    }
  }
  return { x, y: ys, top: ys - 70 * R.cp, bottom: ys + 24 * R.cp, s3x: S3[0] };
}
/** Рука стороны side; inL/inR ∈ [0..1] уводят корень с края силуэта на плечо боковой грани (рука перед телом). */
function armFor(p, side) {
  const e = sideEdge(p, side), k = clamp(side < 0 ? p.inL || 0 : p.inR || 0);
  if (k > 0) e.x += (e.s3x - side * 32 - e.x) * k;
  return { e, a: side < 0 ? armGeom(-1, p.armL, p.bendL, p.lagL || 0, e) : armGeom(1, p.armR, p.bendR, p.lagR || 0, e) };
}

/** Рука стороны side от края силуэта e: контур трубки, точки боков, центр кисти и её направление. */
function armGeom(side, angle, bend, lag, e) {
  const L = 60;
  const S = [e.x - side * 30, e.y];                              // корень спрятан в боку корпуса
  const turn = clamp(-side * bend - lag, -130, 130);
  const d = dirv(angle);
  const chord = L * (1 - 0.2 * Math.pow(Math.abs(turn) / 130, 2));
  const H = [S[0] + 22 * side + d[0] * chord, S[1] + 6 + d[1] * chord];
  const u = rotv(d, -turn / 2), v = rotv(d, turn / 2);
  const k = chord * 0.4;
  const c1 = [S[0] + u[0] * k, S[1] + u[1] * k], c2 = [H[0] - v[0] * k, H[1] - v[1] * k];
  const N = 30, left = [], right = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N, m = 1 - t;
    const P = [m * m * m * S[0] + 3 * m * m * t * c1[0] + 3 * m * t * t * c2[0] + t * t * t * H[0],
               m * m * m * S[1] + 3 * m * m * t * c1[1] + 3 * m * t * t * c2[1] + t * t * t * H[1]];
    const T = [3 * m * m * (c1[0] - S[0]) + 6 * m * t * (c2[0] - c1[0]) + 3 * t * t * (H[0] - c2[0]),
               3 * m * m * (c1[1] - S[1]) + 6 * m * t * (c2[1] - c1[1]) + 3 * t * t * (H[1] - c2[1])];
    const len = Math.hypot(T[0], T[1]) || 1;
    const w = (46 - 15 * Math.pow(t, 0.8)) / 2;
    const n = [(-T[1] / len) * w, (T[0] / len) * w];
    left.push([P[0] + n[0], P[1] + n[1]]);
    right.push([P[0] - n[0], P[1] - n[1]]);
  }
  const pl = (pts) => pts.map((q) => `${f2(q[0])},${f2(q[1])}`).join(" L");
  const hx = H[0] + v[0] * 3, hy = H[1] + v[1] * 3, ha = angOf(v);
  return {
    left, right, hx, hy, ha,
    tube: `M${pl(left)} L${pl([...right].reverse())} Z`,
    edges: `M${pl(left)} M${pl(right)}`,
    hand: `translate(${f2(hx)},${f2(hy)}) rotate(${f2(ha)})`,
  };
}

/** Трубка по кубической Безье S→c1→c2→H с толщиной w0 → w1 (ноги в позе «нога на ногу»). */
function bezTube(S, c1, c2, H, w0, w1, N = 20) {
  const left = [], right = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N, m = 1 - t;
    const P = [m * m * m * S[0] + 3 * m * m * t * c1[0] + 3 * m * t * t * c2[0] + t * t * t * H[0],
               m * m * m * S[1] + 3 * m * m * t * c1[1] + 3 * m * t * t * c2[1] + t * t * t * H[1]];
    const T = [3 * m * m * (c1[0] - S[0]) + 6 * m * t * (c2[0] - c1[0]) + 3 * t * t * (H[0] - c2[0]),
               3 * m * m * (c1[1] - S[1]) + 6 * m * t * (c2[1] - c1[1]) + 3 * t * t * (H[1] - c2[1])];
    const len = Math.hypot(T[0], T[1]) || 1, w = (w0 + (w1 - w0) * t) / 2;
    const n = [(-T[1] / len) * w, (T[0] / len) * w];
    left.push([P[0] + n[0], P[1] + n[1]]);
    right.push([P[0] - n[0], P[1] - n[1]]);
  }
  const pl = (pts) => pts.map((q) => `${f2(q[0])},${f2(q[1])}`).join(" L");
  return `M${pl(left)} L${pl([...right].reverse())} Z`;
}

/* аффинные матрицы [a,b,c,d,e,f] как в SVG — мировые координаты кисти (звезда, пар из чашки) */
const Mx = {
  mul: (m, n) => [m[0] * n[0] + m[2] * n[1], m[1] * n[0] + m[3] * n[1], m[0] * n[2] + m[2] * n[3], m[1] * n[2] + m[3] * n[3],
    m[0] * n[4] + m[2] * n[5] + m[4], m[1] * n[4] + m[3] * n[5] + m[5]],
  t: (x, y) => [1, 0, 0, 1, x, y],
  r: (deg) => { const a = (deg * Math.PI) / 180, c = Math.cos(a), s = Math.sin(a); return [c, s, -s, c, 0, 0]; },
  s: (x, y = x) => [x, 0, 0, y, 0, 0],
  ap: (m, q) => [m[0] * q[0] + m[2] * q[1] + m[4], m[1] * q[0] + m[3] * q[1] + m[5]],
  chain: (...ms) => ms.reduce((a, b) => Mx.mul(a, b)),
};

/** Галтели между боком силуэта и рукой: там, где край трубки выходит из корпуса, — плавная перепонка. */
function fillets(a, e, side) {
  const cross = (pts) => {
    for (let i = 1; i < pts.length; i++) {
      const x0 = side * pts[i - 1][0], x1 = side * pts[i][0], ex = side * e.x;
      if (x0 <= ex && x1 > ex) {
        const f = (ex - x0) / (x1 - x0);
        const J = [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * f, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * f];
        return { J, i, pts };
      }
    }
    return null;
  };
  const hits = [cross(a.left), cross(a.right)].filter((h) => h && h.J[1] > e.top - 4 && h.J[1] < e.bottom + 4);
  if (!hits.length) return "";
  hits.sort((m, n) => m.J[1] - n.J[1]);
  return hits.map((h, idx) => {
    const up = hits.length === 1 ? h.J[1] < e.y : idx === 0;
    const r = up ? 18 : 12;
    // точка на краю трубки примерно на расстоянии r от стыка
    let B = h.pts[h.pts.length - 1], acc = 0, prev = h.J;
    for (let i = h.i; i < h.pts.length; i++) {
      acc += Math.hypot(h.pts[i][0] - prev[0], h.pts[i][1] - prev[1]);
      prev = h.pts[i];
      if (acc >= r) { B = h.pts[i]; break; }
    }
    const A = [e.x, clamp(h.J[1] + (up ? -r : r), e.top, e.bottom)];
    const In = [e.x - side * 16, (A[1] + h.J[1]) / 2];
    return `M${f2(A[0])},${f2(A[1])} Q${f2(h.J[0])},${f2(h.J[1])} ${f2(B[0])},${f2(B[1])} L${f2(In[0])},${f2(In[1])} Z`;
  }).join(" ");
}
const LEG = "M-14,-12 L-14,34 C-30,34 -32,52 -16,52 L18,52 C32,52 30,34 14,34 L14,-12 Z";
const BODY = "M-102,-205 C-102,-250 -88,-264 -45,-268 L50,-272 C90,-272 104,-252 104,-215 L104,-110 C104,-70 90,-50 50,-48 L-50,-46 C-90,-46 -102,-68 -102,-110 Z";

function magnifier(glint) {
  return `<g>
    <line x1="0" y1="0" x2="0" y2="38" stroke="${ORANGE}" stroke-width="9" stroke-linecap="round"/>
    <g transform="translate(0,64)">
      <circle r="27" fill="${THEME === "dark" ? "rgba(255,211,174,.16)" : "rgba(255,255,255,.6)"}" stroke="${ORANGE}" stroke-width="7.5"/>
      <path d="M-14,6 Q-18,-12 -2,-16" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="${glint}"/>
      <circle r="27" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
    </g>
    <circle cy="2" r="18" fill="${C.body}"/>
  </g>`;
}

function mascot(p, uid, opt = {}) {
  p = { ...NEUTRAL, ...p };
  // прищур (lid): верх глаза срезан наклонной «шторкой» — самодовольный взгляд; внутренний край ниже
  const eye = (x, y, i) => {
    const sx = p.eyeS * p.eyeSX, sy = p.eyeS * p.eyeSY;
    const clip = p.lid > 0.001
      ? `<clipPath id="lid${i}-${uid}"><rect x="-40" y="${f2(-24 + 27 * p.lid)}" width="80" height="80" transform="rotate(${f2((i ? -1 : 1) * 13 * p.lid)})"/></clipPath>` : "";
    return `${clip}<g transform="translate(${x},${y}) scale(${f2(sx)},${f2(sy)})" ${clip ? `clip-path="url(#lid${i}-${uid})"` : ""}>
      <ellipse rx="14" ry="20" fill="${ORANGE}" opacity="${0.55 + 0.25 * C.glow}" filter="url(#glow-${uid})"/>
      <ellipse rx="11.5" ry="17.5" fill="${C.eye}" stroke="${ORANGE}" stroke-width="3.5"/>
      <ellipse cx="-2" cy="-6" rx="4" ry="6" fill="#fff" opacity=".55"/>
    </g>`;
  };
  const happyEye = (x) => `<g transform="translate(${x},-160) scale(${f2(p.eyeSX)},1)">
      <path d="M-14,6 Q0,-18 14,6" fill="none" stroke="${ORANGE}" stroke-width="9" stroke-linecap="round" opacity=".45" filter="url(#glow-${uid})"/>
      <path d="M-13,5 Q0,-16 13,5" fill="none" stroke="${ORANGE}" stroke-width="4.5" stroke-linecap="round"/>

  const open = 1 - p.happy;
  const R = bodyR(p);
  const sil = polyD(silhouette(R));
  const { e: eL, a: aL } = armFor(p, -1);
  const { e: eR, a: aR } = armFor(p, 1);
  const fil = `${fillets(aL, eL, -1)} ${fillets(aR, eR, 1)}`.trim();
  // полный поворот кисти в мире (наклон + крен корпуса + направление руки) — чтобы предмет в руке держать ровно
  const totL = aL.ha + p.rot + p.lean, totR = aR.ha + p.rot + p.lean;
  // мизинчик: opt.pinky = { side, ang } — направление в мире (градусы, как у arm); часть варежки, общий контур
  const pk = opt.pinky;
  const pinky = (a, tot, style) => `<g transform="${a.hand}"><rect transform="rotate(${f2(pk.ang - tot)})" x="-5" y="8" width="10" height="22" rx="5" ${style}/></g>`;
  const mitten = (a, style) => `<ellipse transform="${a.hand}" rx="17" ry="19" ${style}/>${
    pk && (pk.side < 0 ? a === aL : a === aR) ? pinky(a, a === aL ? totL : totR, style) : ""}`;
  const held = (v, tot) => (typeof v === "function" ? v(tot) : v || "");
  const legsFn = opt.legs || legs;
  const torsoT = `translate(0,-48) translate(0,${f2(p.y)}) rotate(${f2(p.rot)}) scale(${f4(p.sx)},${f4(p.sy)}) translate(0,48)`;
  // ноги следуют за поворотом: бёдра сходятся по cos(yaw), дальняя нога чуть выше; при крене стопы остаются на полу
  const ya = (p.yaw * Math.PI) / 180;
  const hip = (x0, side) => `translate(${f2(x0 * Math.cos(ya) + Math.sin(ya) * 8)},${f2(-52 - Math.max(0, -side * Math.sin(ya)) * 4)})`;
  function legs(style) {
    return `<g transform="${hip(-34, -1)} rotate(${f2(p.legL - p.lean * 0.7)})"><path d="${LEG}" ${style}/></g>
    <g transform="${hip(36, 1)} rotate(${f2(p.legR - p.lean * 0.7)})"><path d="${LEG}" ${style}/></g>`;
  }
  const fill = `fill="${C.body}"`;
  const frontLine = THEME === "dark" ? "rgba(255,211,174,.38)" : "rgba(255,255,255,.38)";
  // в тёмной теме — тёплый контур по общему силуэту: сначала обводки всех частей, сверху заливки,
  // поэтому шов «рука/корпус» не виден, рука вырастает из тела
  const rimStyle = `fill="none" stroke="${C.rim}" stroke-width="5" stroke-linejoin="round"`;
  const rim = C.glow ? `${legsFn(rimStyle)}<g transform="${torsoT}"><path d="${aL.tube}" ${rimStyle}/><path d="${aR.tube}" ${rimStyle}/>
      ${mitten(aL, rimStyle)}${mitten(aR, rimStyle)}${fil ? `<path d="${fil}" ${rimStyle}/>` : ""}<path d="${sil}" ${rimStyle}/></g>` : "";
  // объём: передняя грань (сечение у лицевой стороны) светлее и размыта — мягкий переход в бока без ребра;
  // снизу корпус уходит в тень, сверху-слева — блик

  const faceGrad = `${facePlane(R)} translate(0,${BCY}) scale(${f2(BA * 0.95)},${f2(BB * 0.95)})`;
  const frontArm = (a, k, id) => {

    return `<mask id="${id}-${uid}" maskUnits="userSpaceOnUse" x="-500" y="-600" width="1000" height="800">
        <linearGradient id="${id}g-${uid}" gradientUnits="userSpaceOnUse" x1="${f2(S[0])}" y1="${f2(S[1])}" x2="${f2(G[0])}" y2="${f2(G[1])}">
          <stop offset=".15" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient>
        <rect x="-500" y="-600" width="1000" height="800" fill="url(#${id}g-${uid})"/></mask>

    <radialGradient id="bf-${uid}" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="${faceGrad}">

    <path d="${aL.tube}" ${fill}/>${mitten(aL, fill)}<g transform="${aL.hand}">${held(opt.handL, totL)}</g>
    <path d="${aR.tube}" ${fill}/>${mitten(aR, fill)}<g transform="${aR.hand}">${held(opt.handR, totR)}</g>

    <g clip-path="url(#bc-${uid})">

    </g>

      <g opacity="${open}">${eye(-40, -166, 0)}${eye(42, -168, 1)}</g>
      <g opacity="${p.happy}">${happyEye(-40)}${happyEye(42)}</g>

        <path d="M-10,0 Q0,10 10,0" opacity="${p.smile}"/>
        <path d="M-10,6 Q0,-6 10,6" opacity="${p.sad}"/>
        <ellipse cy="3" rx="${4 + p.o}" ry="${5 + 1.5 * p.o}" opacity="${clamp(p.o)}"/>
        ${p.grin > 0.001 ? `<path d="M-13,-2 Q0,0 13,-2 Q11,15 0,15 Q-11,15 -13,-2 Z" fill="${C.mouthIn}" opacity="${f2(clamp(p.grin))}"/>` : ""}
      </g>
    </g>
  </g>
  ${opt.legsFront ? opt.legsFront(fill, frontLine, uid) : ""}
  <g transform="${torsoT}">
    ${frontArm(aR, p.frontR, "faR")}${frontArm(aL, p.frontL, "faL")}
    ${opt.handRFront ? `<g transform="${aR.hand}">${held(opt.handRFront, totR)}</g>` : ""}
    ${opt.handLFront ? `<g transform="${aL.hand}">${held(opt.handLFront, totL)}</g>` : ""}

/* ───────────────────────── сцены ─────────────────────────
   Каждая: L — длина цикла (с), blob — форма пятна, draw(t) → svg-строка сцены 300×300.
   Периодика (дыхание, взмахи) взята с периодами, кратными L, чтобы цикл сходился без шва. */

function breath(t, L) { const n = Math.max(1, Math.round(L / 2)); const b = Math.sin((TAU * n * t) / L); return { sy: 1 + 0.013 * b, sx: 1 - 0.006 * b }; }
function ground(cx, rx, k = 1) { return `<ellipse cx="${cx}" cy="264" rx="${rx * k}" ry="${9 * k}" fill="${C.shadow}"/>`; }
// PROBE — сбор позы без отрисовки (для скорости рук), PREV — поза 0.06 с назад
let PROBE = null, PREV = null;
const LAG_GAIN = 0.75;
/** Кончик отстаёт от поворота плеча и корпуса; вверх-вниз (прыжок) — руки «болтаются» за телом. */
function withLag(p, prev) {
  const pp = { ...NEUTRAL, ...p };
  if (!prev) return pp;
  const pv = { ...NEUTRAL, ...prev };
  const dy = (pp.jump + pp.y) - (pv.jump + pv.y);
  pp.lagL = LAG_GAIN * ((pp.armL - pv.armL) + (pp.rot - pv.rot)) - 1.6 * dy;
  pp.lagR = LAG_GAIN * ((pp.armR - pv.armR) + (pp.rot - pv.rot)) + 1.6 * dy;
  return pp;
}
function placeMascot(p, uid, opt, ox = 0, under = "") {
  if (PROBE) { PROBE.p = { ...NEUTRAL, ...p }; return ""; }
  const pp = withLag(p, PREV);
  return `${ground(150 + ox + pp.x * 0.72, 82, 1 - clamp(-pp.jump / 60) * 0.35)}${under}
    <g transform="translate(${150 + ox + pp.x * 0.72},${262 + pp.jump * 0.72}) scale(.72)">${mascot(pp, uid, opt)}</g>`;
}
/** Мировая (сцена 300×300) матрица кисти стороны side для готовой позы pp; tot — её полный поворот. */
function handMatrix(pp, side, ox) {
  const { a } = armFor(pp, side);
  return {
    m: Mx.chain(Mx.t(150 + ox + pp.x * 0.72, 262 + pp.jump * 0.72), Mx.s(0.72), Mx.r(pp.lean),
      Mx.t(0, -48 + pp.y), Mx.r(pp.rot), Mx.s(pp.sx, pp.sy), Mx.t(0, 48), Mx.t(a.hx, a.hy), Mx.r(a.ha)),
    tot: a.ha + pp.rot + pp.lean,
  };
}

/* ── AnimD: кресло, чашка, звезда, ноги «нога на ногу» (координаты маскота, пол — y = 0) ── */
/** Мягкое кресло как на раскадровке: спинка за корпусом, подлокотники-валики, подушка, деревянные ножки. */
function armchair() {

  const leg = (x, dx, top = -26) => `<path d="M${x - 8},${top} L${x + 8},${top} L${x + 3 + dx},-1 Q${x + dx},2 ${x - 3 + dx},-1 Z" fill="${wood}"/>`;

/** Белая чашка, ручка в кулаке (начало координат). phi — поворот вокруг кулака: 0 — чашка левее руки,
    π — правее (так она «оборачивается», когда маскот подносит её через себя ко рту). Верх — −y. */
const CUP_R = 41;
const cupX = (phi) => -CUP_R * Math.cos(phi);
function teacup(phi = 0) {
  const dark = THEME === "dark";
  const line = dark ? "rgba(0,0,0,.35)" : "rgba(27,29,33,.22)";
  const shade = dark ? "#E4DAD2" : "#EEE6E0", gold = "#F2B33D";

  const handle = `<g transform="scale(${f2(c)},1)">
      <path d="M-17,-13 C3,-16 3,9 -21,6" fill="none" stroke="${line}" stroke-width="11.5" stroke-linecap="round"/>
      <path d="M-17,-13 C3,-16 3,9 -21,6" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round"/></g>`;
  // блик живёт на стороне чашки, дальней от кулака
  const sh = c >= 0 ? "M-61,-11 C-59,1 -53,8 -45,11" : "M-21,-11 C-23,1 -29,8 -37,11";
  return `<g>
    ${handle}
    <g transform="translate(${f2(dx)},0)">
      <path d="M-51,14 L-31,14 L-28,20 L-54,20 Z" fill="#FFFFFF" stroke="${line}" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M-67,-20 L-15,-20 C-15,1 -25,12 -33,15 L-49,15 C-57,12 -67,1 -67,-20 Z" fill="#FFFFFF" stroke="${line}" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="${sh}" fill="none" stroke="${shade}" stroke-width="5" stroke-linecap="round"/>
      <path d="M-65,-12 Q-41,-6 -17,-12" fill="none" stroke="${gold}" stroke-width="2.4" stroke-linecap="round"/>

}
const STAR_PTS = Array.from({ length: 10 }, (_, i) => {
  const r = i % 2 ? 6.8 : 15.5, a = -Math.PI / 2 + (i * Math.PI) / 5;
  return [r * Math.cos(a), r * Math.sin(a)];
});
const STAR = "M" + STAR_PTS.map((q) => `${f2(q[0])},${f2(q[1])}`).join(" L") + " Z";
const SPARK = "M0,-7 Q1.2,-1.2 7,0 Q1.2,1.2 0,7 Q-1.2,1.2 -7,0 Q-1.2,-1.2 0,-7 Z";
const starDefs = (uid) => `<defs>
  <radialGradient id="sg-${uid}"><stop offset="0" stop-color="#FFD66B" stop-opacity=".8"/><stop offset=".45" stop-color="#FFB524" stop-opacity=".3"/><stop offset="1" stop-color="#FFA000" stop-opacity="0"/></radialGradient>
  <linearGradient id="sf-${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE68F"/><stop offset="1" stop-color="#FFAE1A"/></linearGradient>
</defs>`;
/** Звезда; smear = [угол скорости, растяжение] — вытягивается вдоль полёта (smear-кадр), поперёк чуть сжимается. */
function starSvg(x, y, rot, s, uid, smear = null) {
  const sm = smear && smear[1] > 0.01
    ? `rotate(${f2(smear[0])}) scale(${f2(1 + smear[1])},${f2(1 - 0.35 * smear[1])}) rotate(${f2(-smear[0])}) ` : "";
  return `<g transform="translate(${f2(x)},${f2(y)}) ${sm}rotate(${f2(rot)}) scale(${f2(s)})">

    <path d="M-3,-9 L-6.5,-2" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".75"/>

/** Ноги крест-накрест. back — нижняя нога (стоит на полу, под корпусом); front — верхняя: бедро лежит поверх
    низа корпуса, колено справа, голень свисает и покачивает стопой. Контур верхней ноги — только по бокам и
    не у самого корня, поэтому она «выходит» из корпуса без шва. */
function crossedLegs(t, L) {
  const swing = 7 * Math.sin((TAU * 6 * t) / L);
  // нижняя нога растёт из своего бедра (справа на экране) и выходит из-под колена верхней, а не из
  // середины низа корпуса: её корень спрятан под верхним бедром, поверх корпуса видна только голень
  const FS = [40, -74], F1 = [43, -58], F2 = [47, -36], FH = [50, -14];
  const far = bezTube(FS, F1, F2, FH, 30, 27);
  const farL = [], farR = [];
  for (let i = 3; i <= 17; i++) {
    const u = i / 20, m = 1 - u;
    const P = [0, 1].map((k) => m * m * m * FS[k] + 3 * m * m * u * F1[k] + 3 * m * u * u * F2[k] + u * u * u * FH[k]);
    const T = [0, 1].map((k) => 3 * m * m * (F1[k] - FS[k]) + 6 * m * u * (F2[k] - F1[k]) + 3 * u * u * (FH[k] - F2[k]));
    const len = Math.hypot(T[0], T[1]) || 1, w = (30 - 3 * u) / 2;
    farL.push([P[0] - (T[1] / len) * w, P[1] + (T[0] / len) * w]);
    farR.push([P[0] + (T[1] / len) * w, P[1] - (T[0] / len) * w]);
  }
  const farEdges = `${polyD(farL, false)} ${polyD(farR, false)}`;
  const K = [78, -66], sd = dirv(-14 - swing), A = [K[0] + sd[0] * 40, K[1] + sd[1] * 40];
  const fd = dirv(-102 - 0.6 * swing), fc = [A[0] + fd[0] * 10, A[1] + fd[1] * 10];
  const fa = (Math.atan2(fd[1], fd[0]) * 180) / Math.PI;
  // бедро + голень одной кривой через колено: Безье S → колено → голень, ширина сужается к стопе
  const N = 26, Lp = [], Rp = [];
  const S = [-52, -60], c1 = [-6, -86], c2 = [K[0] + 8, K[1] - 24];
  const P = (u) => {
    if (u <= 0.72) { const t1 = u / 0.72, m = 1 - t1;
      return [m * m * m * S[0] + 3 * m * m * t1 * c1[0] + 3 * m * t1 * t1 * c2[0] + t1 * t1 * t1 * K[0],
              m * m * m * S[1] + 3 * m * m * t1 * c1[1] + 3 * m * t1 * t1 * c2[1] + t1 * t1 * t1 * K[1]]; }
    const t2 = (u - 0.72) / 0.28; return [K[0] + (A[0] - K[0]) * t2, K[1] + (A[1] - K[1]) * t2];
  };
  for (let i = 0; i <= N; i++) {
    const u = i / N, a = P(Math.max(0, u - 0.02)), b = P(Math.min(1, u + 0.02)), q = P(u);
    const len = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1, w = (33 - 8 * u) / 2;
    Lp.push([q[0] - ((b[1] - a[1]) / len) * w, q[1] + ((b[0] - a[0]) / len) * w]);
    Rp.push([q[0] + ((b[1] - a[1]) / len) * w, q[1] - ((b[0] - a[0]) / len) * w]);
  }
  const tube = polyD([...Lp, ...[...Rp].reverse()]);
  const edges = `${polyD(Lp.slice(2, N - 1), false)} ${polyD(Rp.slice(2, N - 1), false)}`;
  const foot = (st) => `<ellipse transform="translate(${f2(fc[0])},${f2(fc[1])}) rotate(${f2(fa)})" rx="21" ry="11" ${st}/>`;
  return {
    back: (style) => `<path d="${far}" ${style}/><ellipse transform="translate(62,-9)" rx="21" ry="10.5" ${style}/>`,
    front: (style, line, uid) => `<mask id="th-${uid}" maskUnits="userSpaceOnUse" x="-200" y="-200" width="400" height="260">
        <linearGradient id="thg-${uid}" gradientUnits="userSpaceOnUse" x1="${S[0]}" y1="${S[1]}" x2="${S[0] + 62}" y2="${S[1] - 14}">
          <stop offset=".1" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient>
        <rect x="-200" y="-200" width="400" height="260" fill="url(#thg-${uid})"/></mask>
      <path d="${far}" ${style}/>${line ? `<path d="${farEdges}" fill="none" stroke="${line}" stroke-width="2.6" stroke-linecap="round"/>` : ""}
      ${line ? foot(`fill="none" stroke="${line}" stroke-width="5"`) : ""}<g mask="url(#th-${uid})"><path d="${tube}" ${style}/>
      ${line ? `<path d="${edges}" fill="none" stroke="${line}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>` : ""}</g>${foot(style)}`,
  };
}

    },
    body(t) {
      const L = this.L, b = breath(t, L), k = this.phases(t);
      const idle = Math.sin((TAU * t) / L), sway = Math.sin((TAU * 2 * t) / L);
      const gulp = env(t, 4.2, 4.68, 0.08) * Math.sin(TAU * 4.2 * (t - 4.2));
      return {
        yaw: 10 + 47 * k.turn + 5 * k.att + 2 * idle,
        pitch: -4 + 5 * k.ant + 4 * k.cat - 6 * k.att - 8 * k.sip,
        rot: -2 + 0.6 * k.ant - 0.8 * k.thr + 1.5 * k.cat + 3 * k.turn - 2 * k.sip,
        lean: 2 * k.turn,
        y: 0.8 * k.ant + 1.5 * k.cat,
        sy: b.sy - 0.015 * k.ant - 0.025 * k.cat + 0.012 * gulp, sx: b.sx + 0.01 * k.ant + 0.018 * k.cat,
        armR: -100 + 25 * k.ant - 55 * k.thr + 14 * k.cat + 55 * k.turn,
        bendR: 50 - 20 * k.ant - 25 * k.thr - 20 * k.cat - 25 * k.turn,
        armL: 64 - 142 * k.raise + 3 * sway * (1 - k.raise), bendL: 40 - 52 * k.raise,
        frontL: clamp(k.raise * 2.5), inL: k.raise,
        happy: k.bliss, grin: k.grin, smile: 1 - k.grin, lid: 0.55 * k.smug,
        eyeSY: blink(t, [2.62, 7.5]),
        _k: k,
      };
    },
    frame(t) { return withLag(this.body(this.wrap(t)), this.body(this.wrap(t - 0.06))); },
    phi(t) { return Math.PI * E.io(clamp(this.phases(this.wrap(t)).raise)); },
    held(t) { const c = Mx.ap(handMatrix(this.frame(t), 1, this.ox).m, [0, 0]); return [c[0], c[1] - 20]; },
    star(t) {
      if (t > this.tr && t < this.tc) {
        const u = (t - this.tr) / (this.tc - this.tr), P0 = this.held(this.tr), P1 = this.held(this.tc);
        return { x: P0[0] + (P1[0] - P0[0]) * u, y: P0[1] + (P1[1] - P0[1]) * u - 4 * this.h * u * (1 - u), rot: 360 * u, fly: 1 };
      }
      const q = this.held(t), dt = t >= this.tc ? t - this.tc : t + this.L - this.tc;
      return { x: q[0], y: q[1], rot: 18 * Math.exp(-4.5 * dt) * Math.sin(15 * dt) + 8 * this.phases(this.wrap(t)).ant, fly: 0 };
    },
    tilt(t) {
      const k = this.phases(t);
      return 3 * Math.sin((TAU * 2 * t) / this.L) * (1 - k.raise) - 30 * k.sip + 7 * k.settle;
    },
    pose(t) {
      const p = this.body(t), k = p._k, s = this.star(t);
      const dx = s.x - (150 + this.ox + 10), dy = s.y - (262 - 160 * 0.72);
      p.lookX = (1 - k.att) * (2 + 5 * k.turn) + k.att * clamp(dx / 6, -6, 11);
      p.lookY = k.att * clamp(dy / 6, -11, 7) + 2 * k.raise * (1 - k.sip);
      // smear на повороте: глаза чуть вытягиваются по горизонтали пропорционально скорости yaw
      const vy = (this.body(this.wrap(t)).yaw - this.body(this.wrap(t - 0.03)).yaw) / 0.03;
      p.eyeSX = 1 + clamp(Math.abs(vy) / 700, 0, 0.18);
      return p;
    },
    steam(t) {
      const A = 1.35, N = 36, dA = A / N, S = [];
      for (let i = 0; i <= N + 3; i++) {
        const a = i * dA, te = this.wrap(t - a);
        const h = handMatrix(this.frame(te), -1, this.ox);
        S.push({ a, te, m: Mx.mul(h.m, Mx.r(-h.tot + this.tilt(te))), cx: cupX(this.phi(te)), sip: this.phases(te).sip });
      }
      const col = THEME === "dark" ? "rgba(255,236,224,.30)" : "rgba(255,255,255,.88)";
      const pl = (pts) => pts.map((q) => `${f2(q[0])},${f2(q[1])}`).join(" L");
      return [[-12, -24, 0.0, 0.8], [0, -26, 2.1, 1.0], [12, -24, 4.3, 0.75]].map(([rx, ry, ph, sz]) => {
        const E0 = S.map((s) => Mx.ap(s.m, [s.cx + rx, ry]));
        const P = [], spd = [];
        for (let i = 0; i <= N; i++) {
          const a = S[i].a, i0 = Math.max(0, i - 2), i1 = i + 3;
          // скорость чашки в момент выпуска — по окну ±0.1 с, иначе рывки корпуса дают изломы шлейфа
          const v = [(E0[i0][0] - E0[i1][0]) / ((i1 - i0) * dA), (E0[i0][1] - E0[i1][1]) / ((i1 - i0) * dA)];
          const drag = 0.35 * 0.25 * (1 - Math.exp(-a / 0.25));         // унаследованная скорость чашки гаснет
          const wob = (1 + 6 * a) * Math.sin(ph + 6.5 * a + (TAU * 3 * S[i].te) / this.L);
          P.push([E0[i][0] + v[0] * drag + wob, E0[i][1] + v[1] * drag - (30 * a + 14 * a * a)]);
          spd.push(Math.hypot(v[0], v[1]));
        }
        // диффузия: чем старше пар, тем сильнее он размыт — сглаживаем окном, растущим с возрастом
        const Ps = P.map((q, i) => {
          const r = 1 + Math.round((4 * i) / N);
          let sx = 0, sy = 0, n = 0;
          for (let j = Math.max(0, i - r); j <= Math.min(N, i + r); j++) { sx += P[j][0]; sy += P[j][1]; n++; }
          return [sx / n, sy / n];
        });
        const Lp = [], Rp = [];
        for (let i = 0; i <= N; i++) {
          // пар, выпущенный на быстром ходу чашки, рвётся: лента там почти исчезает (нет длинной нити через кадр)
          const brk = clamp(1.35 - spd[i] / 160, 0, 1);
          const u = i / N, w = (12 * sz * Math.pow(u, 0.4) * Math.pow(1 - u, 1.2) * (1 - 0.7 * S[i].sip) * brk) / 2;
          const a0 = Ps[Math.max(0, i - 1)], a1 = Ps[Math.min(N, i + 1)];
          const tx = a1[0] - a0[0], ty = a1[1] - a0[1], len = Math.hypot(tx, ty) || 1;
          Lp.push([Ps[i][0] - (ty / len) * w, Ps[i][1] + (tx / len) * w]);
          Rp.push([Ps[i][0] + (ty / len) * w, Ps[i][1] - (tx / len) * w]);
        }
        return `<path d="M${pl(Lp)} L${pl(Rp.reverse())} Z" fill="${col}"/>`;
      }).join("");
    },
    /** Smear кисти со звездой: пока рука быстрая, за ней тянется сужающийся хвост цвета корпуса (под маскотом). */
    handSmear(t) {
      const dt = 1 / 240, P = [];
      for (let j = 0; j <= 9; j++) P.push(Mx.ap(handMatrix(this.frame(t - j * dt), 1, this.ox).m, [0, 0]));
      const v = Math.hypot(P[0][0] - P[1][0], P[0][1] - P[1][1]) / dt;
      const k = clamp((v - 260) / 420);
      if (k < 0.02) return "";
      let c = "";
      for (let j = 1; j <= 9; j++) {
        const r = 13 * (1 - j / 10) * (0.55 + 0.45 * k);
        c += `<circle cx="${f2(P[j][0])}" cy="${f2(P[j][1])}" r="${f2(r)}"/>`;
      }
      return `<g fill="${C.body}" opacity="${f2(0.85 * k)}">${c}</g>`;
    },
    starLayer(t, uid) {
      const s = this.star(t), L = this.L;
      const s1 = this.star(t - 1 / 120), sv = Math.hypot(s.x - s1.x, s.y - s1.y) * 120;
      const ang = (Math.atan2(s.y - s1.y, s.x - s1.x) * 180) / Math.PI;
      const stretch = s.fly ? clamp((sv - 120) / 900, 0, 0.42) : 0;
      // smear-хвост звезды: сужающаяся золотая полоса по недавней траектории
      let trail = "";
      if (s.fly && stretch > 0.02) {
        const Q = [];
        for (let j = 0; j <= 6; j++) { const q = this.star(t - j * 0.014); if (q.fly || j === 0) Q.push(q); }
        if (Q.length > 2) {
          const Lp = [], Rp = [];
          Q.forEach((q, i) => {
            const a = Q[Math.max(0, i - 1)], b = Q[Math.min(Q.length - 1, i + 1)];
            const tx = b.x - a.x, ty = b.y - a.y, len = Math.hypot(tx, ty) || 1, w = 9 * (1 - i / Q.length);
            Lp.push([q.x - (ty / len) * w, q.y + (tx / len) * w]); Rp.push([q.x + (ty / len) * w, q.y - (tx / len) * w]);
          });
          trail = `<path d="${polyD([...Lp, ...Rp.reverse()])}" fill="#FFD36B" opacity="${f2(0.5 * stretch / 0.42)}"/>`;
        }
      }
      const tw = [[0, 4, 0.0], [1, 5, 2.0], [2, 7, 4.1]].map(([i, n, ph]) => {
        const o = Math.pow(Math.max(0, Math.sin((TAU * n * t) / L + ph)), 6);
        if (o < 0.02) return "";
        const a = ph * 1.7 + (TAU * t) / L, r = 25 + 4 * i;
        return `<path transform="translate(${f2(s.x + r * Math.cos(a))},${f2(s.y + r * Math.sin(a))}) scale(${f2(0.45 + 0.6 * o)})" d="${SPARK}" fill="#FFD36B" opacity="${f2(o)}"/>`;
      }).join("");
      // поймал: звезда сплющивается в ладони и отпружинивает
      const dc = t - this.tc, squash = dc > 0 && dc < 0.35 ? 0.16 * Math.exp(-9 * dc) * Math.cos(18 * dc) : 0;
      const pulse = 1 + 0.07 * Math.sin((TAU * 6 * t) / L);
      return `${starDefs(uid)}${trail}${starSvg(s.x, s.y, s.rot, pulse, uid, s.fly ? [ang, stretch] : squash ? [90, -squash] : null)}${tw}`;
    },
    draw(t, uid) {
      const p = this.pose(t);
      if (PROBE) return placeMascot(p, uid);
      const tilt = this.tilt(t), phi = this.phi(t), legs = crossedLegs(t, this.L);
      const opt = {
        pinky: { side: -1, ang: 118 + 0.4 * tilt + 6 * Math.sin((TAU * 6 * t) / this.L) },
        handLFront: (tot) => `<g transform="rotate(${f2(-tot + tilt)})">${teacup(phi)}</g>`,
        legs: legs.back, legsFront: legs.front,
      };
      const under = `${ground(150 + this.ox, 128)}<g transform="translate(${150 + this.ox},262) scale(.72)">${armchair()}</g>${this.handSmear(t)}`;
      // акценты-штрихи как на раскадровке: у звезды после ловли и над головой во время глотка
      const s = this.star(t);
      const tc = pop(t, this.tc, 0.3) * kf(t, [[2.25, 1], [2.55, 0]]);
      const ts = pop(t, 3.95, 0.35) * kf(t, [[4.75, 1], [5.05, 0]]);
      const hx = 150 + this.ox + 62, hy = 52;
      // вся сцена чуть мельче остальных: кресло и вытянутые руки должны поместиться в кадр
      return `<g transform="translate(150,262) scale(.84) translate(-150,-262)">${placeMascot(p, uid, opt, this.ox, under)}${this.steam(t)}${this.starLayer(t, uid)}
        ${ticks([[s.x + 16, s.y - 20, s.x + 20, s.y - 30], [s.x + 24, s.y - 10, s.x + 34, s.y - 15], [s.x + 26, s.y + 2, s.x + 36, s.y + 2]], clamp(tc), 0.6 + 0.4 * tc, s.x + 18, s.y - 8)}
        ${ticks([[hx - 18, hy, hx - 14, hy - 12], [hx - 4, hy + 4, hx + 4, hy - 6], [hx + 6, hy + 14, hx + 18, hy + 10]], clamp(ts), 0.6 + 0.4 * ts, hx - 6, hy + 8)}</g>`;
    },
  },
};
const ORDER = ["question", "think", "shrug", "search", "sad", "hello"];

/** Полная сцена: пятно + персонаж; enter ∈ [0..1] — появление в приложении (масштаб на пружине + проявление). */
function sceneSvg(id, t, size, enter = 1, uid = id) {
  const s = SCENES[id];
  const tl = ((t % s.L) + s.L) % s.L;
  PROBE = {}; s.draw((((tl - 0.06) % s.L) + s.L) % s.L, uid); PREV = PROBE.p; PROBE = null;
  const e = enter >= 1 ? 1 : E.back(clamp(enter));
  const op = clamp(enter * 2.2);
  const blobS = 0.92 + 0.08 * e + 0.012 * Math.sin((TAU * 3 * tl) / s.L);
  return `<svg width="${size}" height="${size}" viewBox="0 0 300 300" style="opacity:${op}">
    <g transform="translate(150,150) scale(${blobS}) translate(-150,-150)"><path d="${BLOBS[s.blob]}" fill="${C.blob}"/></g>
    <g transform="translate(150,264) scale(${0.85 + 0.15 * e}) translate(-150,-264)">${s.draw(tl, uid)}</g>
  </svg>`;
}

/* ───────────────────────── режимы ───────────────────────── */
const stage = document.getElementById("stage");
let renderAt;
if (MODE === "grid") {
  const W = 1920, H = 1080, cw = 640, ch = 540, sz = 430;
  stage.style.cssText = `width:${W}px;height:${H}px;background:${C.bg}`;
  window.DURATION = 24; // НОК(6, 8): все циклы закрываются ровно
  renderAt = (t) => {
    stage.innerHTML = ORDER.map((id, i) => {
      const s = SCENES[id];
      const x = (i % 3) * cw, y = Math.floor(i / 3) * ch;
      return `<div class="cell" style="left:${x}px;top:${y + 8}px;width:${cw}px">
        ${sceneSvg(id, t, sz)}
        <div class="label" style="color:${C.ink};margin-top:-6px">${i + 1} · ${s.label}</div>
        <div class="hint" style="color:${C.muted}">${s.hint}</div>
      </div>`;
    }).join("");
  };
} else if (MODE === "solo") {
  // одна сцена крупно: слева тёмная тема, справа светлая; два цикла подряд — видно, что шва нет
  const id = Q.get("scene") || "coffee", W = 1920, H = 1080, sz = 860;
  stage.style.cssText = `width:${W}px;height:${H}px`;
  window.DURATION = SCENES[id].L * 2;
  renderAt = (t) => {
    stage.innerHTML = ["dark", "light"].map((th, i) => {
      setTheme(th);
      return `<div style="position:absolute;left:${i * 960}px;top:0;width:960px;height:${H}px;background:${C.bg}">
        <div style="position:absolute;left:${(960 - sz) / 2}px;top:40px">${sceneSvg(id, t, sz, 1, id + th)}</div>
        <div class="label" style="position:absolute;left:0;right:0;top:${40 + sz + 30}px;text-align:center;color:${C.ink}">${SCENES[id].label}</div>
      </div>`;
    }).join("");
  };
} else {
  // экран телефона 1080×1920 (CSS 540×960 при dpr 2): сцены по очереди, как они появлялись бы в приложении
  const W = 540, H = 960, sz = 330;
  stage.style.cssText = `width:${W}px;height:${H}px;background:${C.bg}`;
  const seg = ORDER.map((id) => ({ id, d: 0.5 + SCENES[id].L + 0.35 }));
  window.DURATION = seg.reduce((a, s) => a + s.d, 0);
  renderAt = (t) => {
    let acc = 0, cur = seg[seg.length - 1], local = 0;
    for (const s of seg) { if (t < acc + s.d) { cur = s; local = t - acc; break; } acc += s.d; }
    const sc = SCENES[cur.id];
    const enter = clamp(local / 0.5);
    const vis = clamp((cur.d - local) / 0.35);
    const tl = Math.max(0, local - 0.5);
    const textE = E.out(clamp((local - 0.12) / 0.45));
    stage.innerHTML = `
      <div style="position:absolute;left:${(W - sz) / 2}px;top:${255 - 14 * (1 - vis)}px;opacity:${vis}">${sceneSvg(cur.id, tl, sz, enter)}</div>
      <div class="app-text" style="top:${600 + 16 * (1 - textE)}px;opacity:${textE * vis}">
        <div class="app-title" style="color:${C.ink}">${sc.title}</div>
        <div class="app-sub" style="color:${C.muted}">${sc.sub}</div>
        ${sc.btn ? `<div class="app-btn" style="background:${C.btnBg};color:${C.btnInk}">${sc.btn}</div>` : ""}
      </div>`;
  };
}
window.renderAt = renderAt;
{ const g = document.getElementById("grain"); g.setAttribute("width", stage.style.width); g.setAttribute("height", stage.style.height); }
renderAt(Number(Q.get("t") || 0));
</script>
</body>
